services:
  postgres:
    image: postgres:16-alpine
    container_name: live-bid-postgres-dev
    restart: on-failure
    environment:
      POSTGRES_DB: live_bid
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    networks:
      - live-bid-dev-network
    volumes:
      - live_bid_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d live_bid" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  live_bid_postgres_dev_data:

networks:
  live-bid-dev-network:
