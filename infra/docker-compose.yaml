services:
  #  PostgresQL
  postgres:
    image: postgres:16-alpine
    container_name: live-bid-postgres
    restart: always
    networks:
      - live-bid-network
    volumes:
      - live_bid_postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  # Redis
  redis:
    image: redis:7-alpine
    container_name: live-bid-redis
    restart: always
    networks:
      - live-bid-network
    volumes:
      - live_bid_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # Gateway Service
  gateway:
    build:
      context: ../.
      dockerfile: apps/gateway/Dockerfile
    image: live-bid-gateway:latest
    ports:
      - "3001:3001"
    restart: always
    networks:
      - live-bid-network
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
      core:
        condition: service_started
    env_file:
      - ./.env.gateway
    environment:
      REDIS_HOST: redis
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Auth Service
  auth:
    build:
      context: ../.
      dockerfile: apps/auth/Dockerfile
    image: live-bid-auth:latest
    restart: always
    networks:
      - live-bid-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env.auth
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  # Core Service
  core:
    build:
      context: ../.
      dockerfile: apps/core/Dockerfile
    image: live-bid-core:latest
    restart: always
    networks:
      - live-bid-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env.core
    environment:
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  # Web
  web:
    build:
      context: ../.
      dockerfile: clients/web/Dockerfile
    image: live-bid-web:latest
    restart: always
    networks:
      - live-bid-network
    depends_on:
      gateway:
        condition: service_healthy
    env_file:
      - ./.env.web

  # WordPress database (MySQL)
  wordpress-db:
    image: mysql:8.0
    container_name: live-bid-wordpress-db
    restart: on-failure
    networks:
      - live-bid-network
    volumes:
      - live_bid_wordpress_db_data:/var/lib/mysql
    env_file:
      - ./.env.wordpress-db
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # WordPress (headless CMS + admin panel)
  wordpress:
    build:
      context: ../wordpress
    image: live-bid-wordpress:latest
    container_name: live-bid-wordpress
    restart: on-failure
    networks:
      - live-bid-network
    depends_on:
      wordpress-db:
        condition: service_healthy
    env_file:
      - ./.env.wordpress
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      # PHP appended to wp-config.php by the official image. It only reads the
      # S3_* variables at runtime. Keep PHP variables ($name) out of this
      # block, because Compose would try to interpolate them.
      WORDPRESS_CONFIG_EXTRA: |
        if (getenv('S3_BUCKET')) {
          if (!getenv('S3_ENDPOINT') || !getenv('S3_ACCESS_KEY') || !getenv('S3_SECRET_KEY') || !getenv('S3_PUBLIC_URL')) {
            http_response_code(500);
            exit('S3_BUCKET is set, but S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY or S3_PUBLIC_URL is empty.');
          }
          define('ADVMO_MINIO_KEY', getenv('S3_ACCESS_KEY'));
          define('ADVMO_MINIO_SECRET', getenv('S3_SECRET_KEY'));
          define('ADVMO_MINIO_BUCKET', getenv('S3_BUCKET'));
          define('ADVMO_MINIO_ENDPOINT', getenv('S3_ENDPOINT'));
          define('ADVMO_MINIO_DOMAIN', rtrim(getenv('S3_PUBLIC_URL'), '/'));
          define('ADVMO_MINIO_APPEND_BUCKET_TO_DOMAIN', false);
          define('ADVMO_MINIO_REGION', getenv('S3_REGION') ?: 'us-east-1');
          define('ADVMO_MINIO_PATH_STYLE_ENDPOINT', getenv('S3_PATH_STYLE') === 'true');
        }
    volumes:
      - live_bid_wordpress_core:/var/www/html
      - live_bid_wordpress_uploads:/var/www/html/wp-content/uploads
      # Only mu-plugins is bind-mounted. Mounting the whole plugins folder
      # would hide the plugins baked into the image.
      - ../wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost/wp-json/ && runuser -u www-data -- wp core is-installed --path=/var/www/html || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  live-bid-network:
    name: live-bid-network
    driver: bridge

volumes:
  live_bid_postgres_data:
    name: live_bid_postgres_data
  live_bid_redis_data:
    name: live_bid_redis_data
  live_bid_wordpress_core:
    name: live_bid_wordpress_core
  live_bid_wordpress_uploads:
    name: live_bid_wordpress_uploads
  live_bid_wordpress_db_data:
    name: live_bid_wordpress_db_data
