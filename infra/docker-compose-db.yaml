services:
  postgres:
    image: postgres:16-alpine
    container_name: live-bid-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: live_bid
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - live_bid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d live_bid" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: live-bid-redis
    restart: on-failure
    ports:
      - "6379:6379"
    volumes:
      - live_bid_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # WordPress database (MySQL)
  wordpress-db:
    image: mysql:8.0
    container_name: live-bid-wordpress-db-dev
    restart: on-failure
    networks:
      - live-bid-dev-network
    volumes:
      - live_bid_wordpress_db_dev_data:/var/lib/mysql
    env_file:
      - ./.env.wordpress-db
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # WordPress (headless CMS + admin panel)
  wordpress:
    build:
      context: ../wordpress
    image: live-bid-wordpress:dev
    container_name: live-bid-wordpress-dev
    restart: on-failure
    networks:
      - live-bid-dev-network
    depends_on:
      wordpress-db:
        condition: service_healthy
    env_file:
      - ./.env.wordpress
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      # PHP appended to wp-config.php by the official image. It only reads the
      # S3_* variables at runtime. Keep PHP variables ($name) out of this
      # block, because Compose would try to interpolate them.
      WORDPRESS_CONFIG_EXTRA: |
        if (getenv('S3_BUCKET')) {
          if (!getenv('S3_ENDPOINT') || !getenv('S3_ACCESS_KEY') || !getenv('S3_SECRET_KEY') || !getenv('S3_PUBLIC_URL')) {
            http_response_code(500);
            exit('S3_BUCKET is set, but S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY or S3_PUBLIC_URL is empty.');
          }
          define('ADVMO_MINIO_KEY', getenv('S3_ACCESS_KEY'));
          define('ADVMO_MINIO_SECRET', getenv('S3_SECRET_KEY'));
          define('ADVMO_MINIO_BUCKET', getenv('S3_BUCKET'));
          define('ADVMO_MINIO_ENDPOINT', getenv('S3_ENDPOINT'));
          define('ADVMO_MINIO_DOMAIN', rtrim(getenv('S3_PUBLIC_URL'), '/'));
          define('ADVMO_MINIO_APPEND_BUCKET_TO_DOMAIN', false);
          define('ADVMO_MINIO_REGION', getenv('S3_REGION') ?: 'us-east-1');
          define('ADVMO_MINIO_PATH_STYLE_ENDPOINT', getenv('S3_PATH_STYLE') === 'true');
        }
    volumes:
      - live_bid_wordpress_dev_core:/var/www/html
      - live_bid_wordpress_dev_uploads:/var/www/html/wp-content/uploads
      # Only mu-plugins is bind-mounted. Mounting the whole plugins folder
      # would hide the plugins baked into the image.
      - ../wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
    ports:
      - "8080:80"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost/wp-json/ && runuser -u www-data -- wp core is-installed --path=/var/www/html || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  live_bid_postgres_data:
  live_bid_redis_data:
  live_bid_wordpress_db_dev_data:
  live_bid_wordpress_dev_core:
  live_bid_wordpress_dev_uploads:
